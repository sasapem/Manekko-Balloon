<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>まねっこバルーン</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background:#000;color:#fff;}
  #app{width:100vw;height:100vh;position:relative;overflow:hidden;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vw;}
  #title-screen{background:linear-gradient(160deg,#ff9a9e,#fad0c4,#ffecd2);color:#222;overflow-y:auto;}
  .title{font-size:11vw;color:#c62828;text-shadow:2px 2px 0 #fff;letter-spacing:.1em;margin:2vh 0 1vh;font-weight:bold;text-align:center;}
  .subtitle{font-size:4vw;color:#444;margin-bottom:2vh;text-align:center;line-height:1.6;}
  .legend{width:90vw;max-width:500px;background:#fff;border-radius:4vw;padding:2vw 3vw;box-shadow:0 4px 12px rgba(0,0,0,.15);margin-bottom:3vh;}
  .legend-row{display:flex;justify-content:space-between;align-items:center;padding:.8vw 1.5vw;font-size:3.5vw;border-bottom:1px solid #eee;}
  .legend-row:last-child{border:none;}
  .color-chip{width:6vw;height:6vw;border-radius:50%;display:inline-block;margin-right:2vw;vertical-align:middle;border:1px solid #ccc;}
  .start-btn{padding:2.5vh 12vw;font-size:6vw;background:#c62828;color:#fff;border:none;border-radius:100px;font-family:inherit;box-shadow:0 6px 0 #8e0000;font-weight:bold;}
  .start-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #8e0000;}
  .note{margin-top:2vh;margin-bottom:3vh;font-size:3.2vw;color:#666;text-align:center;line-height:1.5;}

  /* === GAME SCREEN: 上=風船 / 下=顔 === */
  #game-screen{background:#000;padding:0;display:block;}

  .pane{position:absolute;left:0;right:0;overflow:hidden;background:#000;}
  .pane-top{top:0;height:45vh;border-bottom:4px solid #ffeb3b;}
  .pane-bottom{top:45vh;height:45vh;border-bottom:4px solid #c62828;}
  .pane video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .pane-bottom video{transform:scaleX(-1);} /* 内カメラはミラー */

  .pane-label{position:absolute;top:1vh;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:.7vh 3vw;border-radius:100px;font-size:3.8vw;letter-spacing:.1em;border:1px solid rgba(255,255,255,.3);color:#fff;z-index:4;}
  .pane-top .pane-label{background:rgba(0,0,0,.8);}
  .pane-bottom .pane-label{background:rgba(198,40,40,.9);}

  .scan-reticle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:35vh;max-width:70vw;height:35vh;max-height:70vw;border:3px dashed rgba(255,235,59,.85);border-radius:50%;pointer-events:none;z-index:3;}
  .scan-reticle.active{border-color:#4caf50;border-style:solid;box-shadow:0 0 20px rgba(76,175,80,.6);}

  .hud-top{position:absolute;top:1vh;left:2vw;right:2vw;display:flex;justify-content:space-between;pointer-events:none;z-index:5;}
  .hud-item{background:rgba(0,0,0,.7);padding:.7vh 3vw;border-radius:100px;font-size:3.8vw;font-weight:bold;border:1px solid rgba(255,255,255,.3);color:#fff;}

  /* Middle info strip (between panes, ~10vh) */
  .info-strip{position:absolute;top:90vh;left:0;right:0;height:10vh;background:linear-gradient(180deg,#fff8f0,#ffecb3);display:flex;align-items:center;justify-content:space-between;padding:0 2vw;z-index:6;}
  .card-mini{display:flex;align-items:center;gap:2vw;flex:1;}
  .card-balloon-mini{width:10vw;height:12vw;max-width:50px;max-height:60px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff;}
  .card-color-mini{font-size:4vw;font-weight:bold;color:#333;}
  .match-badge{font-size:3.5vw;padding:.3vh 2vw;border-radius:100px;color:#fff;font-weight:bold;}
  .match-badge.no{background:#888;}
  .match-badge.yes{background:#4caf50;}
  .finish-btn{padding:1vh 4vw;font-size:3.8vw;background:#333;color:#fff;border:none;border-radius:100px;font-family:inherit;font-weight:bold;}
  .rescan-btn{padding:1vh 4vw;font-size:3.8vw;background:#1976d2;color:#fff;border:none;border-radius:100px;font-family:inherit;font-weight:bold;margin-right:2vw;}

  .progress-wrap{position:absolute;top:calc(45vh - 6px);left:0;right:0;height:6px;background:rgba(0,0,0,.3);z-index:5;}
  .progress-bar{height:100%;background:linear-gradient(90deg,#ffeb3b,#ff9800,#f44336);width:0%;transition:width .1s linear;}

  .grid{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(8,1fr);gap:1vw;padding:1vw 2vw;background:#111;z-index:7;}
  .balloon-cell{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.4);position:relative;transition:all .3s;}
  .balloon-cell.claimed{opacity:.3;filter:grayscale(1);}
  .balloon-cell.active{box-shadow:0 0 10px #ffeb3b;border-color:#ffeb3b;transform:scale(1.12);}

  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);z-index:100;color:#222;font-size:5vw;flex-direction:column;text-align:center;padding:4vw;}
  .spinner{width:15vw;height:15vw;border:4px solid #eee;border-top-color:#c62828;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:3vh;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #result-screen{background:linear-gradient(180deg,#fff8f0,#ffe4b5);color:#333;padding:4vh 4vw;justify-content:flex-start;overflow-y:auto;}
  .result-title{font-size:9vw;margin:2vh 0;font-weight:bold;letter-spacing:.1em;}
  .result-score{font-size:18vw;font-weight:bold;color:#c62828;line-height:1;}
  .result-score-label{font-size:5vw;margin-top:1vh;color:#666;}
  .result-label{font-size:7vw;margin-top:3vh;font-weight:bold;text-align:center;}
  .result-comment{font-size:4.5vw;margin-top:1vh;color:#555;text-align:center;line-height:1.5;padding:0 4vw;}
  .retry-btn{margin-top:2vh;padding:2vh 8vw;font-size:5vw;background:#c62828;color:#fff;border:none;border-radius:100px;font-family:inherit;font-weight:bold;}
  .save-btn{margin-top:1vh;padding:1.5vh 6vw;font-size:4.2vw;background:#2e7d32;color:#fff;border:none;border-radius:100px;font-family:inherit;font-weight:bold;}
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:2vw;width:100%;margin:3vh 0 1vh;}
  .gallery-item{aspect-ratio:1;background:#fff;border-radius:3vw;overflow:hidden;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.15);border:3px solid #fff;}
  .gallery-item img{width:100%;height:100%;object-fit:cover;}
  .gallery-item .tag{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:#fff;font-size:2.8vw;padding:.3vh 1vw;text-align:center;}
  .clear-banner{font-size:6vw;font-weight:bold;color:#fff;background:#c62828;padding:2vh 6vw;border-radius:3vw;margin:1vh 0 2vh;text-align:center;line-height:1.4;}
  .prize-note{font-size:4vw;color:#444;margin:1vh 0;text-align:center;line-height:1.5;}
  .hidden{display:none!important;}
  .flycount{position:absolute;left:50%;top:30%;font-size:25vw;pointer-events:none;z-index:60;animation:balloonFly 1.5s ease-out forwards;text-shadow:0 4px 20px rgba(0,0,0,.5);}
  @keyframes balloonFly{0%{transform:translate(-50%,0) scale(.4);opacity:1;}100%{transform:translate(-50%,-80vh) scale(1.5);opacity:0;}}
  .countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40vw;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.5);z-index:60;pointer-events:none;font-weight:bold;}
</style>
</head>
<body>
<div id="app">
  <div id="title-screen" class="screen">
    <div class="title">まねっこ<br>バルーン</div>
    <div class="subtitle">風船をスキャン→同じ顔をつくろう</div>
    <div class="legend" id="legend"></div>
    <button class="start-btn" id="startBtn">スキャン開始</button>
    <div class="note">📷 カメラと顔認識を使います</div>
  </div>

  <div id="game-screen" class="screen hidden">
    <!-- 上ペイン: 風船ビュー(外カメラ or 固定写真) -->
    <div class="pane pane-top">
      <video id="videoTop" autoplay muted playsinline></video>
      <img id="balloonSnap" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:2;">
      <div class="scan-reticle" id="scanReticle"></div>
      <div class="pane-label" id="topLabel">🎈 風船を映す</div>
      <div class="hud-top">
        <div class="hud-item">⏱ <span id="timerHud">60</span>s</div>
        <div class="hud-item">🎈 <span id="clearedHud">0</span></div>
      </div>
    </div>

    <!-- 中央情報バー -->
    <div class="info-strip">
      <div class="card-mini" id="cardMini">
        <div class="card-balloon-mini" id="cardBalloonMini" style="background:#ccc;"></div>
        <div>
          <div class="card-color-mini" id="cardColorMini">風船を認識中…</div>
          <div id="matchBadgeWrap"><span class="match-badge no" id="matchBadge">—</span></div>
        </div>
      </div>
      <div style="display:flex;gap:2vw;">
        <button class="rescan-btn" id="rescanBtn">別の風船</button>
        <button class="finish-btn" id="finishBtn">終わる</button>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

    <!-- 下ペイン: 顔ビュー(内カメラ) -->
    <div class="pane pane-bottom">
      <video id="videoBottom" autoplay muted playsinline></video>
      <div id="faceWait" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#111;color:#aaa;font-size:5vw;z-index:2;">風船スキャン後に顔判定</div>
      <div class="pane-label">😀 あなたの顔</div>
    </div>

    <!-- 取得済み風船グリッド(一番下) -->
    <div class="grid" id="grid"></div>
  </div>

  <div id="result-screen" class="screen hidden">
    <div class="result-title">結果</div>
    <div class="clear-banner" id="clearBanner">クリア!</div>
    <div class="prize-note" id="prizeNote">スタッフに見せて商品をもらおう🎁</div>
    <div style="font-size:4.5vw;color:#666;margin:2vh 0 1vh;font-weight:bold;">📸 あなたの表情コレクション</div>
    <img id="collageImg" style="max-width:90vw;width:100%;border-radius:3vw;box-shadow:0 4px 16px rgba(0,0,0,.2);margin-bottom:1vh;">
    <button class="save-btn" id="saveBtn">📥 コレクション画像を保存</button>
    <div style="font-size:4.5vw;color:#666;margin:3vh 0 1vh;font-weight:bold;">🎪 今日のみんなの顔</div>
    <div class="gallery" id="sharedGallery" style="grid-template-columns:repeat(5,1fr);"></div>
    <button class="retry-btn" onclick="location.reload()">もう一度</button>
  </div>

  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <div id="loadingText">カメラと顔認識を起動中…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script>
/* 事前登録: 色 → 表情マッピング(8風船) */
const BALLOONS = [
  {color:'red',    cssColor:'#e53935', expr:'angry',     emoji:'😡', label:'怒る',           jp:'赤'},
  {color:'cyan',   cssColor:'#4dd0e1', expr:'sad',       emoji:'😭', label:'悲しい',         jp:'水色'},
  {color:'purple', cssColor:'#8e24aa', expr:'tongue',    emoji:'😛', label:'ベロ出し',       jp:'紫'},
  {color:'yellow', cssColor:'#fdd835', expr:'surprised', emoji:'😯', label:'びっくり',       jp:'黄色'},
  {color:'orange', cssColor:'#fb8c00', expr:'happy',     emoji:'😀', label:'わらう',         jp:'オレンジ'},
  {color:'green',  cssColor:'#43a047', expr:'puff',      emoji:'🤢', label:'ほっぺ膨らまし', jp:'緑'},
  {color:'white',  cssColor:'#f5f5f5', expr:'neutral',   emoji:'😐', label:'真顔',           jp:'白'},
  {color:'pink',   cssColor:'#ec87a8', expr:'wink',      emoji:'😉', label:'ウィンク',       jp:'ピンク'},
];
const EXPR_JP={happy:'わらう',sad:'かなしい',angry:'おこる',surprised:'びっくり',fearful:'こわい',disgusted:'うえっ',neutral:'すん'};
const EXPR_EMOJI={happy:'😀',sad:'😢',angry:'😠',surprised:'😮',fearful:'😨',disgusted:'🤢',neutral:'😐'};

const GAME_TIME_S=30;
const HOLD_TRIGGER_MS=1500;
const CLAIM_COOLDOWN_MS=2000;
const EXPR_THRESHOLD=0.28;
const COLOR_STABLE_MS=200;

(function renderLegend(){
  const el=document.getElementById('legend');
  el.innerHTML='<div style="font-size:3.8vw;color:#666;text-align:center;line-height:1.7;">8色の風船があるよ<br>風船の顔をよく見て、同じ顔を作ろう<br>AIが判定します</div>';
})();

let video, videoBalloon, videoFace, sampleCanvas, sctx;
let cleared=0, running=false;
let scoresArr=new Array(BALLOONS.length).fill(null); // null=未挑戦, 0-100=スコア
let holdMs=0, holdIdx=null, cooldownUntil=0;
let lastColorName=null, colorStableSince=0;
let judging=false;
let captureCanvas, cctx;
let captures=[];
let gameMode='scan'; // 'scan' | 'identify'
let activeBalloonIdx=-1;
let currentStream=null;
let switching=false;

async function loadModels(){
  const M='https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
  await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(M),faceapi.nets.faceExpressionNet.loadFromUri(M)]);
}
async function useCamera(facing){
  // facing: 'environment' (外) | 'user' (内)
  switching=true;
  if(currentStream){currentStream.getTracks().forEach(t=>t.stop());currentStream=null;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:640,height:480},audio:false});}
  catch(e){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
  currentStream=stream;
  const target=(facing==='environment')?videoBalloon:videoFace;
  const other=(facing==='environment')?videoFace:videoBalloon;
  if(other)other.srcObject=null;
  target.srcObject=stream;
  await new Promise(r=>target.onloadedmetadata=r);
  await target.play();
  switching=false;
  return target;
}

async function startCamera(){
  videoBalloon=document.getElementById('videoTop');
  videoFace=document.getElementById('videoBottom');
  await useCamera('environment'); // 最初は外カメラで風船スキャン
  video=videoBalloon;
  sampleCanvas=document.createElement('canvas');
  sampleCanvas.width=videoBalloon.videoWidth||640;sampleCanvas.height=videoBalloon.videoHeight||480;
  sctx=sampleCanvas.getContext('2d',{willReadFrequently:true});
  captureCanvas=document.createElement('canvas');
  captureCanvas.width=480;
  captureCanvas.height=Math.round(480*(videoBalloon.videoHeight||480)/(videoBalloon.videoWidth||640));
  cctx=captureCanvas.getContext('2d');
  return true;
}

// 風船をスキャンから固定スナップにし、内カメラに切り替え
async function enterIdentify(balIdx){
  if(gameMode!=='scan'||switching)return;
  gameMode='identify';
  activeBalloonIdx=balIdx;
  // 風船の現フレームをスナップショット化
  const snap=document.createElement('canvas');
  snap.width=videoBalloon.videoWidth;snap.height=videoBalloon.videoHeight;
  snap.getContext('2d').drawImage(videoBalloon,0,0);
  const url=snap.toDataURL('image/jpeg',0.9);
  const img=document.getElementById('balloonSnap');
  img.src=url;
  img.style.display='block';
  videoBalloon.style.display='none';
  showCard(balIdx);
  document.getElementById('topLabel').textContent='✓ '+BALLOONS[balIdx].jp.toUpperCase()+' FOUND';
  document.getElementById('scanReticle').classList.add('active');
  // 内カメラに切り替え
  document.getElementById('faceWait').textContent='📷 内カメラ起動中…';
  await useCamera('user');
  document.getElementById('faceWait').style.display='none';
  video=videoFace; // face-api/captureは内カメラ
}

// スキャンモードに戻る
async function enterScan(){
  if(gameMode==='scan'||switching)return;
  gameMode='scan';
  activeBalloonIdx=-1;
  document.getElementById('balloonSnap').style.display='none';
  videoBalloon.style.display='block';
  document.getElementById('faceWait').style.display='flex';
  document.getElementById('faceWait').textContent='📷 外カメラ起動中…';
  hideCard();
  await useCamera('environment');
  video=videoBalloon;
  document.getElementById('faceWait').textContent='風船スキャン後に顔判定';
  holdMs=0;lastColorName=null;
}
function renderGrid(activeIdx=-1){
  const g=document.getElementById('grid');g.innerHTML='';
  BALLOONS.forEach((b,i)=>{
    const cell=document.createElement('div');
    const hasScore=(scoresArr[i]!==null);
    cell.className='balloon-cell'+(hasScore?' claimed':'')+(i===activeIdx?' active':'');
    cell.style.background=b.cssColor;
    if(hasScore){
      cell.innerHTML='<div style="font-size:3.8vw;font-weight:bold;color:#111;background:rgba(255,255,255,.85);padding:.1vh .8vw;border-radius:100px;">'+scoresArr[i]+'</div>';
    }
    g.appendChild(cell);
  });
}
function flyBalloon(emoji){
  const el=document.createElement('div');el.className='flycount';el.textContent=emoji;
  document.getElementById('game-screen').appendChild(el);setTimeout(()=>el.remove(),1600);
}
function showPrizeBanner(){
  const el=document.createElement('div');
  el.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85);color:#ffeb3b;font-size:14vw;font-weight:bold;z-index:80;pointer-events:none;text-shadow:0 4px 20px #000;animation:cardIn .5s ease-out;text-align:center;line-height:1.3;';
  el.innerHTML='🎁<br>商品ゲット!<br><span style="font-size:8vw;color:#fff;">スタッフに見せて!</span>';
  document.getElementById('game-screen').appendChild(el);
  setTimeout(()=>el.remove(),2400);
}
function showScoreFeedback(score){
  if(score>=100)return; // 商品ゲット演出で代替
  const el=document.createElement('div');
  const bg='rgba(255,152,0,.92)';
  const emoji='😅';
  const msg='惜しい! もう一回!';
  el.style.cssText=`position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${bg};color:#fff;z-index:80;pointer-events:none;animation:cardIn .4s ease-out;text-align:center;padding:4vw;`;
  el.innerHTML=`<div style="font-size:28vw;">${emoji}</div><div style="font-size:10vw;font-weight:bold;margin-top:2vh;">${msg}</div>`;
  document.getElementById('game-screen').appendChild(el);
  setTimeout(()=>el.remove(),1500);
}
async function countdown(n){
  const el=document.createElement('div');el.className='countdown';
  document.getElementById('game-screen').appendChild(el);
  for(let i=n;i>0;i--){el.textContent=i;await new Promise(r=>setTimeout(r,700));}
  el.textContent='SCAN!';await new Promise(r=>setTimeout(r,500));el.remove();
}

function sampleScanCenterColor(){
  // スキャン中は videoBalloon(外カメラ)の中央をサンプル
  if(!videoBalloon||!videoBalloon.videoWidth)return null;
  const w=videoBalloon.videoWidth,h=videoBalloon.videoHeight;
  sctx.drawImage(videoBalloon,0,0,w,h);
  const cx=w/2,cy=h/2,r=Math.min(w,h)*.22;
  const x0=Math.max(0,Math.round(cx-r)),y0=Math.max(0,Math.round(cy-r));
  const sw=Math.min(w-x0,Math.round(r*2)),sh=Math.min(h-y0,Math.round(r*2));
  if(sw<=0||sh<=0)return null;
  const img=sctx.getImageData(x0,y0,sw,sh).data;
  let rs=0,gs=0,bs=0,n=0;
  const cxL=r,cyL=r;
  for(let y=0;y<sh;y+=4){
    for(let x=0;x<sw;x+=4){
      const dx=x-cxL,dy=y-cyL;
      if(dx*dx+dy*dy>r*r)continue;
      const i=(y*sw+x)*4;rs+=img[i];gs+=img[i+1];bs+=img[i+2];n++;
    }
  }
  if(n===0)return null;
  return [rs/n,gs/n,bs/n];
}
function rgbToHsv(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  let h=0;
  if(d!==0){
    if(max===r)h=((g-b)/d)%6;
    else if(max===g)h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;if(h<0)h+=360;
  }
  const s=max===0?0:d/max;
  return [h,s*100,max*100];
}
function classifyColor(rgb){
  const [h,s,v]=rgbToHsv(rgb[0],rgb[1],rgb[2]);
  if(v<22)return 'black';
  if(s<12&&v>70)return 'white';
  if(s<18)return null;
  if(h<15||h>=345)return 'red';
  if(h<38)return 'orange';
  if(h<65)return 'yellow';
  if(h<165)return 'green';
  if(h<200)return 'cyan';
  if(h<260)return 'blue';
  if(h<310)return 'purple';
  return 'pink';
}
function findBalloonByColor(cn){if(!cn)return -1;for(let i=0;i<BALLOONS.length;i++)if(BALLOONS[i].color===cn)return i;return -1;}

async function geminiJudge(bal){
  const src=videoFace;
  if(!src||!src.videoWidth)return {score:0,dataUrl:null};
  const w=480, h=Math.round(480*src.videoHeight/src.videoWidth);
  captureCanvas.width=w;captureCanvas.height=h;
  cctx.save();
  cctx.scale(-1,1);
  cctx.drawImage(src,-w,0,w,h);
  cctx.restore();
  const dataUrl=captureCanvas.toDataURL('image/jpeg',0.85);
  const b64=dataUrl.split(',')[1];
  try{
    const res=await fetch('/api/judge',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({target_expr:bal.expr,target_jp:bal.label,image:b64})
    });
    const data=await res.json();
    console.log('gemini:',data);
    return {score:(data.score||0), dataUrl};
  }catch(e){console.log('judge fetch err',e);return{score:0,dataUrl};}
}

function showCard(idx){
  const bal=BALLOONS[idx];
  document.getElementById('cardBalloonMini').style.background=bal.cssColor;
  document.getElementById('cardColorMini').textContent=bal.jp+'の風船 — 同じ顔を作ろう';
  document.getElementById('topLabel').textContent='✓ '+bal.jp.toUpperCase()+' 識別完了';
  document.getElementById('scanReticle').classList.add('active');
}
function hideCard(){
  document.getElementById('cardBalloonMini').style.background='#ccc';
  document.getElementById('cardColorMini').textContent='風船を上の画面に映して';
  document.getElementById('topLabel').textContent='🎈 風船をここに映す';
  document.getElementById('scanReticle').classList.remove('active');
}

async function detectLoop(){
  const opts=new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.3});
  let lastT=Date.now();
  while(running){
    const now=Date.now();
    const dt=Math.min(200,now-lastT);lastT=now;
    if(switching){await new Promise(r=>requestAnimationFrame(r));continue;}
    try{
      if(gameMode==='scan'){
        // 外カメラで色スキャン
        const rgb=sampleScanCenterColor();
        const cn=rgb?classifyColor(rgb):null;
        if(cn===lastColorName){/*keep*/}else{lastColorName=cn;colorStableSince=now;}
        const stable=(cn!==null)&&(now-colorStableSince>=COLOR_STABLE_MS);
        const balIdx=stable?findBalloonByColor(cn):-1;
        const badge=document.getElementById('matchBadge');
        if(balIdx<0){
          badge.className='match-badge no';badge.textContent='色判別中';
          document.getElementById('cardColorMini').textContent='風船を外カメラに映して';
          document.getElementById('cardBalloonMini').style.background='#ccc';
          renderGrid(-1);
        }else if((scoresArr[balIdx]!==null)){
          badge.className='match-badge no';badge.textContent='取得済';
          document.getElementById('cardColorMini').textContent=BALLOONS[balIdx].jp+' は取得済';
          document.getElementById('cardBalloonMini').style.background=BALLOONS[balIdx].cssColor;
          renderGrid(balIdx);
        }else{
          badge.className='match-badge yes';badge.textContent='識別!';
          renderGrid(balIdx);
          enterIdentify(balIdx);
        }
      }else if(gameMode==='identify'){
        const balIdx=activeBalloonIdx;
        if(balIdx<0){enterScan();await new Promise(r=>requestAnimationFrame(r));continue;}
        const bal=BALLOONS[balIdx];
        const badge=document.getElementById('matchBadge');
        if(judging){
          badge.className='match-badge no';badge.textContent='🤖 AI判定中…';
          document.getElementById('progressBar').style.width='100%';
        }else{
          // 激甘モード: face-api判定スキップ、カメラ映ってれば即Gemini
          const hasStream=videoFace&&videoFace.readyState>=2&&videoFace.videoWidth>0;
          badge.className='match-badge yes';badge.textContent='AI判定待ち';
          if(hasStream&&now>cooldownUntil){holdMs+=dt;}
          else{holdMs=Math.max(0,holdMs-dt*.5);}
          document.getElementById('progressBar').style.width=Math.min(100,holdMs/HOLD_TRIGGER_MS*100)+'%';
          if(holdMs>=HOLD_TRIGGER_MS&&!judging){
            judging=true;
            geminiJudge(bal).then(({score,dataUrl})=>{
              // 試行=判定済み。スコア記録して必ず次へ
              scoresArr[balIdx]=score;cleared++;
              captures.push({balloon:bal,dataUrl,score,timestamp:Date.now()});
              if(dataUrl){
                const b64=dataUrl.split(',')[1];
                fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},
                  body:JSON.stringify({color:bal.color,expr:bal.expr,label:bal.label,image:b64,score})}).catch(e=>console.log('save err',e));
              }
              flyBalloon(bal.emoji);
              document.getElementById('clearedHud').textContent=cleared;
              if(score>=100){
                badge.className='match-badge yes';badge.textContent='🎁 100点!';
                showPrizeBanner();
              }else if(score>=60){
                badge.className='match-badge yes';badge.textContent=score+'点';
              }else{
                badge.className='match-badge no';badge.textContent=score+'点';
              }
              showScoreFeedback(score);
              renderGrid(-1);
              // 同じ風船でリトライ可能にする: 識別モードに留まる
              holdMs=0;cooldownUntil=Date.now()+CLAIM_COOLDOWN_MS;judging=false;
            }).catch(e=>{
              console.log('judge err',e);
              holdMs=0;cooldownUntil=Date.now()+CLAIM_COOLDOWN_MS;judging=false;
              setTimeout(()=>{if(running)enterScan();},800);
            });
          }
        }
      }
    }catch(e){console.log('err',e);}
    await new Promise(r=>requestAnimationFrame(r));
  }
}

async function runGame(){
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('loading').classList.remove('hidden');
  try{await Promise.all([loadModels(),startCamera()]);}
  catch(e){document.getElementById('loadingText').textContent='起動失敗: '+(e.message||e);console.error(e);return;}
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  renderGrid();
  await countdown(3);
  running=true;detectLoop();
  const startT=Date.now();
  const timerEl=document.getElementById('timerHud');
  while(running){
    const remain=Math.max(0,GAME_TIME_S*1000-(Date.now()-startT));
    if(timerEl)timerEl.textContent=Math.ceil(remain/1000);
    if(remain<=0||cleared>=BALLOONS.length){running=false;break;}
    await new Promise(r=>setTimeout(r,200));
  }
  showResult();
}
document.addEventListener('DOMContentLoaded',()=>{
  const fb=document.getElementById('finishBtn');
  if(fb)fb.addEventListener('click',()=>{running=false;});
  const rb=document.getElementById('rescanBtn');
  if(rb)rb.addEventListener('click',()=>{if(gameMode==='identify')enterScan();});
});
function generateCollage(caps){
  return new Promise(resolve=>{
    if(caps.length===0){resolve(null);return;}
    const cols=Math.min(4,caps.length);
    const rows=Math.ceil(caps.length/cols);
    const tileW=360,tileH=480,headerH=100;
    const cv=document.createElement('canvas');
    cv.width=cols*tileW;cv.height=rows*tileH+headerH;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#fff8f0';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#c62828';ctx.font='bold 48px "Hiragino Maru Gothic ProN",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🎈 風船顔合わせ',cv.width/2,headerH/2);
    let loaded=0;
    caps.forEach((c,i)=>{
      const img=new Image();
      img.onload=()=>{
        const r=Math.floor(i/cols),col=i%cols;
        const x=col*tileW,y=r*tileH+headerH;
        ctx.fillStyle=c.balloon.cssColor;
        ctx.fillRect(x+6,y+6,tileW-12,tileH-12);
        ctx.drawImage(img,x+18,y+18,tileW-36,tileH-110);
        // label bar
        ctx.fillStyle='rgba(255,255,255,.95)';
        ctx.fillRect(x+18,y+tileH-92,tileW-36,70);
        ctx.fillStyle='#222';ctx.font='bold 32px sans-serif';
        ctx.fillText(c.balloon.jp+' '+(c.balloon.label||''),x+tileW/2,y+tileH-70);
        ctx.fillStyle='#c62828';ctx.font='bold 40px sans-serif';
        ctx.fillText((c.score||0)+'点',x+tileW/2,y+tileH-35);
        loaded++;
        if(loaded===caps.length)resolve(cv.toDataURL('image/jpeg',0.92));
      };
      img.onerror=()=>{loaded++;if(loaded===caps.length)resolve(cv.toDataURL('image/jpeg',0.92));};
      img.src=c.dataUrl;
    });
  });
}

async function showResult(){
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  const banner=document.getElementById('clearBanner');
  const prize=document.getElementById('prizeNote');
  // 最高スコア=ベスト1枚の得点、合計スコア=全試行の合計
  const total=scoresArr.filter(s=>s!==null).reduce((a,b)=>a+b,0);
  const attempted=scoresArr.filter(s=>s!==null).length;
  const hasPrize=scoresArr.some(s=>s===100)||captures.some(c=>c.score===100);
  const best=captures.length?Math.max(...captures.map(c=>c.score||0)):0;
  banner.innerHTML=`ベスト ${best}点<br><small style="font-size:4vw;color:#666;">${captures.length}回挑戦 / 合計${total}点</small>`;
  if(hasPrize){
    prize.innerHTML='🎁 <b>商品ゲット!</b> スタッフに見せて';
  }else if(best>=90){
    prize.textContent='惜しい!もう一歩で商品!';
  }else{
    prize.textContent='もう一度チャレンジしてみよう';
  }
  // Collage
  const col=await generateCollage(captures);
  if(col){document.getElementById('collageImg').src=col;}
  else{document.getElementById('collageImg').style.display='none';}
  // Save button
  const btn=document.getElementById('saveBtn');
  if(captures.length===0){btn.style.display='none';}
  else{btn.style.display='block';}
  btn.onclick=()=>{
    const cim=document.getElementById('collageImg');
    if(cim&&cim.src){
      const a=document.createElement('a');a.href=cim.src;a.download=`balloon_collage_${Date.now()}.jpg`;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      btn.textContent='✓ 保存しました';
    }
  };
  // 共有ギャラリー(今日のみんなの顔)
  fetch('/api/gallery').then(r=>r.json()).then(data=>{
    const sg=document.getElementById('sharedGallery');sg.innerHTML='';
    const balloonByColor={};BALLOONS.forEach(b=>balloonByColor[b.color]=b);
    (data.items||[]).reverse().forEach(it=>{
      const bal=balloonByColor[it.color]||{cssColor:'#999',emoji:'?',jp:it.color};
      const item=document.createElement('div');
      item.className='gallery-item';item.style.borderColor=bal.cssColor;
      item.innerHTML=`<img src="${it.url}"><div class="tag">${bal.jp} ${bal.emoji}</div>`;
      sg.appendChild(item);
    });
    if((data.items||[]).length===0){sg.innerHTML='<div style="grid-column:span 5;text-align:center;color:#999;font-size:3.8vw;padding:2vh;">まだ誰もクリアしてないよ</div>';}
  }).catch(e=>console.log('gallery err',e));
}
document.getElementById('startBtn').addEventListener('click',runGame);
